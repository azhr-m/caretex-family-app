<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FCF8F1" />
    <meta name="description" content="CARETEX Family: updates, messages, documents and events from your family member's care center." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>CARETEX Family</title>
    <style>
      /* Painted before any JavaScript loads; React replaces it with the real splash or screen. */
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #1f2a44;
        color: #fff;
        font: 900 38px/1.2 system-ui, sans-serif;
        letter-spacing: 0.18em;
      }
      .boot-tile {
        display: flex;
        width: 104px;
        height: 104px;
        align-items: center;
        justify-content: center;
        border: 1px solid rgb(255 255 255 / 0.2);
        border-radius: 30px;
        background: rgb(255 255 255 / 0.1);
      }
      @media (prefers-color-scheme: dark) {
        .boot {
          background: #141b2b;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-busy="true">
        <div class="boot-tile">
          <svg width="54" height="54" viewBox="16 16 32 32" aria-hidden="true">
            <path d="M32 46s-14-8.2-14-18a8 8 0 0 1 14-5.3A8 8 0 0 1 46 28c0 9.8-14 18-14 18z" fill="#fff" />
          </svg>
        </div>
        <span dir="ltr">CARETEX</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
